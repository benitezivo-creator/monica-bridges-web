<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F1D8"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7A1E"/>
      <stop offset="100%" stop-color="#F5E298"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Crest & Monogram Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer Diamond Frame -->
    <path d="M 42 2 L 80 42 L 42 82 L 4 42 Z" stroke="url(#goldGrad)" stroke-width="1.5" fill="#121215" fill-opacity="0.8"/>
    <path d="M 42 8 L 74 42 L 42 76 L 10 42 Z" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6"/>
    
    <!-- Crown Accents -->
    <path d="M 33 22 L 37 28 L 42 20 L 47 28 L 51 22 L 49 32 L 35 32 Z" fill="url(#goldGrad)" />
    <circle cx="33" cy="21" r="1.5" fill="#FFF"/>
    <circle cx="42" cy="18" r="1.8" fill="#FFF"/>
    <circle cx="51" cy="21" r="1.5" fill="#FFF"/>

    <!-- Monogram MB -->
    <text x="42" y="58" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">MB</text>
    
    <!-- Small Bottom Accent Star -->
    <path d="M 42 66 L 43.5 70 L 47.5 70 L 44.5 72.5 L 45.5 76.5 L 42 74 L 38.5 76.5 L 39.5 72.5 L 36.5 70 L 40.5 70 Z" fill="#D4AF37" opacity="0.85"/>
  </g>

  <!-- Typography Brand Text -->
  <g transform="translate(108, 0)">
    <text x="0" y="47" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="27" font-weight="600" letter-spacing="4.5" fill="url(#goldGrad)">MÓNICA BRIDGES</text>
    
    <!-- Decorative hairline with diamond center -->
    <line x1="2" y1="58" x2="380" y2="58" stroke="url(#goldStroke)" stroke-width="1"/>
    <polygon points="191,58 195,54 199,58 195,62" fill="#D4AF37"/>

    <!-- Subtitle -->
    <text x="3" y="75" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="9" font-weight="500" letter-spacing="4" fill="#A1A1AA">RECLUTAMIENTO DE PERSONAL DE LIMPIEZA DE ALTA GAMA</text>
  </g>
</svg>
