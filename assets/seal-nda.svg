<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldNdaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#F5E4B0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
    <radialGradient id="shieldBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1F1E24"/>
      <stop offset="80%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#08080A"/>
    </radialGradient>
    <filter id="ndaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#ndaGlow)">
    <!-- Outer Octagon / Shield -->
    <path d="M 120 18 L 195 48 L 195 125 C 195 175 120 215 120 215 C 120 215 45 175 45 125 L 45 48 Z" 
          fill="url(#shieldBg)" stroke="url(#goldNdaGrad)" stroke-width="2.5"/>
          
    <path d="M 120 26 L 187 53 L 187 122 C 187 167 120 203 120 203 C 120 203 53 167 53 122 L 53 53 Z" 
          stroke="#D4AF37" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  </g>

  <!-- Lock & Keyhole / Laurel Motif -->
  <g transform="translate(120, 85)">
    <!-- Padlock Body -->
    <rect x="-24" y="-4" width="48" height="42" rx="6" fill="#18181B" stroke="url(#goldNdaGrad)" stroke-width="2"/>
    <!-- Padlock Shackle -->
    <path d="M -14 -4 L -14 -18 C -14 -27 14 -27 14 -18 L 14 -4" stroke="url(#goldNdaGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Keyhole -->
    <circle cx="0" cy="12" r="4.5" fill="url(#goldNdaGrad)"/>
    <polygon points="-2,14 2,14 3.5,23 -3.5,23" fill="url(#goldNdaGrad)"/>
    <!-- Micro Sparkle -->
    <polygon points="12,-1 14,-5 16,-1 20,0 16,1 14,5 12,1 8,0" fill="#FFF"/>
  </g>

  <!-- Typography -->
  <text x="120" y="152" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="url(#goldNdaGrad)" text-anchor="middle" letter-spacing="3">ACUERDO NDA</text>
  <text x="120" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CONFIDENCIALIDAD</text>
  <text x="120" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="500" fill="#A1A1AA" text-anchor="middle" letter-spacing="1.5">MÁXIMA DISCRECIÓN</text>
</svg>
